# Unified worker overlay — starts all three worker processes in one command:
#   docker compose -f docker-compose.yml -f docker-compose.worker.yml up -d
#
# Individual overlays (docker-compose.relay.yml, docker-compose.wi4.yml) are kept
# for running workers in isolation during development.

services:
  relay:
    build:
      context: ./apps/worker
    command: ["node", "dist/relay.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-wishlist}
      POSTGRES_USER: ${POSTGRES_USER:-wishlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
      KAFKA_BROKERS: redpanda:9092
      RELAY_TRANSACTIONAL_ID: ${RELAY_TRANSACTIONAL_ID:-wishlist-outbox-relay}
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-500}
      RELAY_POLL_MS: ${RELAY_POLL_MS:-200}
      RELAY_PUBLISH_TIMEOUT_MS: ${RELAY_PUBLISH_TIMEOUT_MS:-10000}
      RELAY_RETENTION_DAYS: ${RELAY_RETENTION_DAYS:-7}
      RELAY_METRICS_PORT: "9464"
    ports:
      - "127.0.0.1:${RELAY_METRICS_PORT:-9464}:9464"
    stop_grace_period: 180s

  cache-invalidator:
    build:
      context: ./apps/worker
    command: ["node", "dist/cache-invalidator.js"]
    depends_on:
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INVALIDATOR_METRICS_PORT: "9465"
    ports:
      - "127.0.0.1:${INVALIDATOR_METRICS_PORT:-9465}:9465"
    stop_grace_period: 30s

  simulator:
    build:
      context: ./apps/worker
    command: ["node", "dist/simulator.js"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SIMULATOR_API_BASE_URL: ${SIMULATOR_API_BASE_URL:-http://api:8000/api/v1}
      SIMULATOR_ADMIN_EMAIL: ${SIMULATOR_ADMIN_EMAIL:-admin@carrefour.test}
      SIMULATOR_ADMIN_PASSWORD: ${SIMULATOR_ADMIN_PASSWORD:-Demo@1234}
      SIMULATOR_METRICS_PORT: "9466"
    ports:
      - "127.0.0.1:${SIMULATOR_METRICS_PORT:-9466}:9466"
    stop_grace_period: 15s
